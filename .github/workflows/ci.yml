name: CI

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  # Only superseded PR pushes are cancelled; each master commit has its own group (and verdict),
  # because a queued run in a shared group would be dropped.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Untrusted PR fields go through env vars, never straight into the script.
      - name: Validate branch, commits, and PR title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/git/conventions.mjs branch "$HEAD_REF"
          node scripts/git/conventions.mjs title "$PR_TITLE"
          node scripts/git/conventions.mjs commits "$BASE_SHA" HEAD

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fallow audit compares against the merge base.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Docs
        run: node scripts/checks/docs-check.mjs
      - name: Tracked files
        run: node scripts/checks/tracked-files.mjs
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Local environment
        run: cp .env.example .env
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Architecture
        run: pnpm run arch
      - name: Dead code
        run: pnpm run dead-code
      - name: Migrations match schema
        run: pnpm run db:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Start infrastructure
        run: pnpm run infra:up
      - name: Migrate database
        run: pnpm run db:migrate
      - name: Integration tests
        run: pnpm run test:integration
      - name: Build web
        run: pnpm --filter @contextvault/web run build
      - name: Build api
        run: pnpm --filter @contextvault/api run build
      - name: Build worker
        run: pnpm --filter @contextvault/worker run build
      - name: Infrastructure smoke
        run: pnpm run infra:smoke
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Browser tests
        run: pnpm run test:e2e
      - name: Infrastructure logs
        if: failure()
        run: pnpm run infra:logs
      - name: Stop infrastructure
        if: always()
        run: pnpm run infra:down
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
